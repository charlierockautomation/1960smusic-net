# Cloudflare Workers (static assets) — git-connected via Workers Builds.
# Only dist/ deploys as static assets. scripts/build_dist.py builds it from the
# tracked public web files, so working files (CLAUDE.md, *.md trackers, docs/,
# gen/, worker/) never reach the live site. A thin Worker script
# (worker/index.js) sits in front for the Daily Guessing Game leaderboard API;
# every other path falls straight through to assets.
name = "1960smusic-net"
compatibility_date = "2026-08-13"
main = "worker/index.js"

[build]
command = "python3 scripts/build_dist.py"

[assets]
directory = "./dist"
binding = "ASSETS"
# Fallback for client-side navigation / clean 404 handling.
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "DAILY_LEADERBOARD"
id = "e15a355325294c4e88bd9a60e37a5500"

# Deploy test: production branch confirmed set to main 2026-08-14.
