<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3524"/>
      <stop offset="1" stop-color="#2C1E13"/>
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#FBF5E6"/>
      <stop offset="1" stop-color="#E7D7B4"/>
    </radialGradient>
    <linearGradient id="needle" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FFB07A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- walnut cabinet -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#cab)"/>
  <rect x="18" y="18" width="476" height="476" rx="90" fill="none" stroke="#B8894A" stroke-width="14"/>

  <!-- ivory dial face -->
  <circle cx="256" cy="256" r="176" fill="url(#face)"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#B8894A" stroke-width="16"/>

  <!-- tick marks around the top arc -->
  <g stroke="#5C4326" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="96"  x2="256" y2="124"/>
    <line x1="146" y1="146" x2="166" y2="166"/>
    <line x1="366" y1="146" x2="346" y2="166"/>
    <line x1="100" y1="256" x2="128" y2="256"/>
    <line x1="412" y1="256" x2="384" y2="256"/>
  </g>

  <!-- glowing tube pointer needle -->
  <g filter="url(#glow)">
    <path d="M256 256 L316 150 L256 118 L196 150 Z" fill="url(#needle)"/>
  </g>
  <!-- brass hub -->
  <circle cx="256" cy="256" r="34" fill="#B8894A" stroke="#8A6636" stroke-width="8"/>
  <circle cx="256" cy="256" r="11" fill="#3D2B1F"/>
</svg>
