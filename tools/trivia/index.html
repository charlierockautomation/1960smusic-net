<script>
const ROUND = 10;
let questions = [];
let idx = 0, score = 0, answered = false;

/* Pick a trivia fact that doesn't give away the title, if possible. */
function clueFor(song) {
  const facts = (song.trivia_facts || []).filter(Boolean);
  const t = song.title.toLowerCase();
  const safe = facts.filter(f => !f.toLowerCase().includes(t));
  const chosen = (safe.length ? safe : facts);
  return chosen.length ? randomPick(chosen) : null;
}

function buildQuestions() {
  // songs that have at least one usable fact
  const usable = DATA.songs.filter(s => (s.trivia_facts || []).some(Boolean));
  const chosen = shuffle(usable).slice(0, ROUND);
  return chosen.map(song => {
    // distractors: prefer same genre, fall back to any; unique titles
    const sameGenre = DATA.songs.filter(s => s.genre_id === song.genre_id && s.id !== song.id);
    const others = DATA.songs.filter(s => s.id !== song.id);
    const pool = (sameGenre.length >= 3 ? sameGenre : others);
    const distractors = [];
    const seenTitles = new Set([song.title]);
    for (const s of shuffle(pool)) {
      if (seenTitles.has(s.title)) continue;
      seenTitles.add(s.title); distractors.push(s.title);
      if (distractors.length === 3) break;
    }
    const options = shuffle([song.title, ...distractors]);
    return { song, clue: clueFor(song), options, answer: song.title };
  });
}

function renderScore() {
  document.getElementById('scorebar').innerHTML =
    'Score: <strong>' + score + '</strong> / ' + ROUND +
    (idx < questions.length ? '  &middot;  Question ' + (idx + 1) + ' of ' + ROUND : '');
}

function renderQuestion() {
  answered = false;
  const q = questions[idx];
  const opts = q.options.map(o =>
    '<button class="option" data-title="' + escapeHtml(o) + '">' + escapeHtml(o) + '</button>').join('');
  document.getElementById('game').innerHTML =
    '<div class="q">' +
      '<p class="progress">' + escapeHtml(genreName(q.song.genre_id)) + '  &middot;  ' + escapeHtml(String(q.song.year)) + '</p>' +
      '<p class="prompt">Which song is this fact about?</p>' +
      '<p class="lead" style="margin:0 0 18px">&ldquo;' + escapeHtml(q.clue) + '&rdquo;</p>' +
      '<div class="options">' + opts + '</div>' +
      '<div class="feedback" id="fb"></div>' +
      '<div id="next-wrap" class="hidden" style="margin-top:18px">' +
        '<button class="btn" id="next">' + (idx === ROUND - 1 ? 'See results' : 'Next question') + '</button>' +
      '</div>' +
    '</div>';
  document.querySelectorAll('.option').forEach(b => b.addEventListener('click', onAnswer));
  document.getElementById('next').addEventListener('click', onNext);
  renderScore();
}

function onAnswer(e) {
  if (answered) return;
  answered = true;
  const q = questions[idx];
  const chosen = e.target.getAttribute('data-title');
  const correct = chosen === q.answer;
  if (correct) score++;
  document.querySelectorAll('.option').forEach(b => {
    b.disabled = true;
    const t = b.getAttribute('data-title');
    if (t === q.answer) b.classList.add('correct');
    else if (t === chosen) b.classList.add('wrong');
  });
  document.getElementById('fb').innerHTML = correct
    ? '<strong style="color:#2f7d24">Correct!</strong> &ldquo;' + escapeHtml(q.answer) + '&rdquo; by ' + escapeHtml(q.song.artist_name) + '.'
    : 'The answer was <strong>&ldquo;' + escapeHtml(q.answer) + '&rdquo;</strong> by ' + escapeHtml(q.song.artist_name) + '.';
  document.getElementById('next-wrap').classList.remove('hidden');
  renderScore();
}

function onNext() {
  idx++;
  if (idx >= questions.length) renderResults();
  else renderQuestion();
}

function renderResults() {
  renderScore();
  let msg;
  if (score === ROUND) msg = 'A perfect round. You really know the decade.';
  else if (score >= 7) msg = 'Excellent. You clearly grew up with (or dug deep into) the 60s.';
  else if (score >= 4) msg = 'Not bad at all. A solid ear for the era.';
  else msg = 'Plenty more to discover. Try another round!';
  document.getElementById('game').innerHTML =
    '<div class="result">' +
      '<p class="kicker">Round complete</p>' +
      '<h2>' + score + ' / ' + ROUND + '</h2>' +
      '<p class="desc">' + msg + '</p>' +
      '<button class="btn" id="again">Play again</button>' +
    '</div>';
  document.getElementById('again').addEventListener('click', start);
}

function start() {
  questions = buildQuestions();
  idx = 0; score = 0;
  renderQuestion();
}

(async function init() {
  await loadData();
  start();
})();
</script>
